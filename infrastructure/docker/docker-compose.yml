# Local development stack. Usage (from repo root):
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
name: eduverse
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_PASSWORD: eduverse
      POSTGRES_DB: eduverse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduverse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://eduverse:eduverse@postgres:5432/eduverse?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
